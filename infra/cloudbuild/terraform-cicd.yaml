# Terraform CI/CD Pipeline for Cloud Build
# https://cloud.google.com/build/docs/build-config
#
# Service Account: cloudbuild@${PROJECT_ID}.iam.gserviceaccount.com
# Required Roles:
#   - roles/cloudbuild.builds.builder
#   - roles/run.admin
#   - roles/artifactregistry.writer
#   - roles/secretmanager.secretAccessor

substitutions:
  _TF_VERSION: "1.14"
  _TF_DIR: "infra/env/shared"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Format Check
  - id: "terraform-fmt"
    name: "hashicorp/terraform:${_TF_VERSION}"
    dir: "${_TF_DIR}"
    args:
      - fmt
      - -check
      - -recursive

  # 2. Initialize
  - id: "terraform-init"
    name: "hashicorp/terraform:${_TF_VERSION}"
    dir: "${_TF_DIR}"
    args:
      - init
      - -input=false

  # 3. Validate
  - id: "terraform-validate"
    name: "hashicorp/terraform:${_TF_VERSION}"
    dir: "${_TF_DIR}"
    args:
      - validate
      - -no-color

  # 4. Plan
  - id: "terraform-plan"
    name: "hashicorp/terraform:${_TF_VERSION}"
    dir: "${_TF_DIR}"
    args:
      - plan
      - -no-color
      - -lock=false
      - -input=false
      - -var-file=terraform.tfvars
      - -out=tfplan

  # 5. Apply
  - id: "terraform-apply"
    name: "hashicorp/terraform:${_TF_VERSION}"
    dir: "${_TF_DIR}"
    args:
      - apply
      - -auto-approve
      - -input=false
      - tfplan

timeout: "1200s"
