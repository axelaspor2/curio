# Docker Compose for Curio local development
# 2026 best practice: no version field needed (Compose Specification)
# Reference: https://docs.docker.com/compose/compose-file/

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: curio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio_dev_password
      POSTGRES_DB: curio
    ports:
      - "5433:5432" # Using 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curio -d curio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
