<!doctype html>
<html lang="ja" style="overscroll-behavior: none; overflow: hidden; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Curio - Personalized Curation</title>
    <script>
      // GitHub Pages SPA routing: redirect 404 to index with path preserved
      // The path is encoded and passed via sessionStorage so the router can handle it
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      sessionStorage.setItem('spa-redirect', path + search + hash);
      window.location.replace('/');
    </script>
  </head>
  <body style="overscroll-behavior: none; overflow: hidden; height: 100%; margin: 0;">
    <noscript>JavaScript is required to run this application.</noscript>
  </body>
</html>
