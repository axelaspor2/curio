# Docker Compose for Curio local development
# 2026 best practice: no version field needed (Compose Specification)
# Reference: https://docs.docker.com/compose/compose-file/

name: curio

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: curio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio_dev_password
      POSTGRES_DB: curio
    ports:
      - "5433:5432" # Using 5433 to avoid conflict with local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curio -d curio"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: curio-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: curio_test
      POSTGRES_PASSWORD: curio_test_password
      POSTGRES_DB: curio_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curio_test -d curio_test"]
      interval: 5s
      timeout: 5s
      retries: 5
